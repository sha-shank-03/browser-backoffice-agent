name: Offline workflow checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Install exact wheels and headless shell
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --no-cache-dir --only-binary=:all: --require-hashes -r requirements.lock
          .venv/bin/python -m playwright install --with-deps chromium --only-shell
      - name: Validate runtime and tests
        run: |
          .venv/bin/python -m backoffice doctor
          .venv/bin/python -m unittest discover -s tests/unit -v
          .venv/bin/python -m unittest discover -s tests/contract -v
          .venv/bin/python -m unittest discover -s tests/integration -v
          .venv/bin/python -m unittest discover -s acceptance/tests -v
      - name: Two fictional journeys and independent verification
        run: |
          .venv/bin/python -m backoffice demo --scenario happy --provider scripted --approval fixture --run-dir work/ci-happy
          .venv/bin/python -m evaluation.verify --run-dir work/ci-happy
          .venv/bin/python -m backoffice demo --scenario conflicting-existing --provider scripted --approval fixture --run-dir work/ci-conflict
          .venv/bin/python -m evaluation.verify --run-dir work/ci-conflict
      - name: Frozen final comparison
        run: |
          .venv/bin/python -m evaluation.freeze --suite heldout --check
          .venv/bin/python -m acceptance.checkpoint --check
          .venv/bin/python -m evaluation.run --suite heldout --allow-heldout --agents reactive-scripted,fixed-macro --out work/ci-heldout
          .venv/bin/python -m evaluation.check_report --report work/ci-heldout/report.json --require-cases 30 --require-safe
          .venv/bin/python -m acceptance.sensitivity --source-run work/ci-heldout/reactive-scripted/heldout-01 --out work/ci-verifier-negative
          .venv/bin/python -m acceptance.checkpoint --check
